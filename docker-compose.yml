version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=disastersense
      - DB_USER=postgres
      - DB_PASSWORD=disastersense123
    depends_on:
      - db
    volumes:
      - ./models:/app/models

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=disastersense
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=disastersense123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
